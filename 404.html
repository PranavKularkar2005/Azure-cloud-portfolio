
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-family: Arial, sans-serif;
            background: #0b1120;
            color: #f1f5f9;
            padding: 20px;
        }

        .error-container {
            max-width: 600px;
        }

        h1 {
            font-size: 100px;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background: #38bdf8;
            color: #0b1120;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
        }

        a:hover {
            background: #0ea5e9;
        }
    </style>
</head>

<body>

    <div class="error-container">
        <h1>404</h1>

        <h2>Oops! Page Not Found</h2>

        <p>
            The page you are looking for might have been removed,
            had its name changed, or is temporarily unavailable.
        </p>

        <a href="index.html">Back to Home</a>
    </div>

</body>
</html>
